org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (26.1+ is unobfuscated: no mappings)
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.4
fabric_api_version=0.161.0+26.2

# Mod
mod_id=coffeeclient
version=1.11.1-ALPHA
group=dev.coffeeclient

# Bundled libraries (jar-in-jar)
starscript_version=0.2.5
# Netty proxy handlers: must match the netty version Minecraft ships.
netty_version=4.2.15.Final

# Compile-only mod compat (optional mixins, applied only when the mod is installed)
sodium_version=mc26.2-0.9.2-fabric

# deployToTestProfile copies the jar into <testProfileDir>/mods. The path is machine-specific, so set it in
# ~/.gradle/gradle.properties (testProfileDir=/path/to/profile) or pass -PtestProfileDir=...
